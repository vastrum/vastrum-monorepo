[package]
name = "mapper-wasm"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
vastrum-ts-macros.workspace = true
serde-wasm-bindgen = "0.6"
vastrum-shared-types = { version = "0.1.0", path = "../../../../shared-types" }
mapper-abi = { path = "../../abi" }

