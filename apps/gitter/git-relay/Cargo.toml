[package]
name = "vastrum-git-relay"
version = "0.1.0"
edition = "2024"

[lib]
name = "vastrum_git_relay"
path = "src/lib.rs"

[dependencies]

vastrum-git-lib = { path = "../vastrum-git-lib" }
vastrum-shared-types.workspace = true
vastrum-native-lib.workspace = true
vastrum-rpc-client.workspace = true
vastrum-node.workspace = true

tokio = { version = "1", features = ["full"] }

axum = "0.8"

russh = "0.49"
async-trait = "0.1"

gix = { version = "0.80", default-features = false }
gix-hash = "0.22.1"
gix-object = "0.57.0"

serde = { version = "1", features = ["derive"] }

tracing = "0.1"

anyhow = "1"

ssh-key = "0.6"

hex = "0.4"
tempfile = "3"
rand = "0.8"
flate2 = "1"
sha1 = "0.10"
futures = "0.3"

[dev-dependencies]
vastrum-native-lib = { workspace = true, features = ["localnet"] }
base64 = "0.22"

